<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="480" viewBox="0 0 960 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pd-grad-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17A2B8"/>
      <stop offset="100%" stop-color="#0F4C81"/>
    </linearGradient>
    <linearGradient id="pd-grad-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FD3E0"/>
      <stop offset="100%" stop-color="#1562A6"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ICON: Stacked papers -->
  <g transform="translate(80, 80)" filter="url(#softShadow)">
    <!-- Back sheet -->
    <rect x="130" y="20" width="140" height="180" rx="18" fill="url(#pd-grad-2)"/>
    <!-- Middle sheet -->
    <rect x="90" y="60" width="140" height="180" rx="18" fill="url(#pd-grad-2)" opacity="0.9"/>
    <!-- Front sheet -->
    <rect x="0" y="0" width="180" height="200" rx="20" fill="url(#pd-grad-1)"/>
    <!-- Front sheet details (content lines) -->
    <rect x="24" y="56" width="120" height="12" rx="6" fill="#FFFFFF" opacity="0.85"/>
    <rect x="24" y="92" width="96" height="12" rx="6" fill="#FFFFFF" opacity="0.75"/>
  </g>

  <!-- WORDMARK -->
  <g fill="#0F4C81" font-family="Open Sans, Arial, Helvetica, sans-serif">
    <text x="360" y="170" font-size="72" font-weight="700" letter-spacing="1.2">PAPELES</text>
    <text x="360" y="240" font-size="72" font-weight="700" letter-spacing="1.2">DIGITALES</text>
    <text x="362" y="288" font-size="28" font-weight="600" fill="#17A2B8">Content Management</text>
  </g>
</svg>
